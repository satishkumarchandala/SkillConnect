<main class="login-layout">

  <!-- LEFT PANEL (SAME AS LOGIN) -->
  <section class="visual">
    
  </section>

  <!-- RIGHT PANEL -->
  <section class="form-area">

    <!-- TOP LOGIN -->
    <div class="top-register">
      <span>Already have an account?</span>
      <a routerLink="/login">Login</a>
    </div>

    <div class="card">
      <header>
        <h1>Create <span>Account</span></h1>
        <p>Join SkillConnect today</p>
      </header>

      <form #registerForm="ngForm"
            (ngSubmit)="onSubmit()"
            class="register-form"
            novalidate>

        <input
          type="text"
          name="fullName"
          [(ngModel)]="customer.fullName"
          required
          placeholder="Full Name" />

        <input
          type="email"
          name="email"
          [(ngModel)]="customer.email"
          required
          email
          placeholder="Email Address" />

        <input
          type="tel"
          name="mobileNumber"
          [(ngModel)]="customer.mobileNumber"
          required
          pattern="[0-9]{10}"
          placeholder="Mobile Number" />

        <input
          type="password"
          name="password"
          [(ngModel)]="customer.password"
          required
          minlength="6"
          placeholder="Password" />

        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="customer.confirmPassword"
          required
          placeholder="Confirm Password" />

        <div *ngIf="passwordMismatch" class="error-message">
          Passwords do not match
        </div>

        <!-- CUSTOMER TYPE -->
        <div class="radio-group">
          <label>
            <input type="radio"
                   name="customerType"
                   value="customer"
                   [(ngModel)]="customer.customerType"
                   (change)="onCustomerTypeChange()"
                   required />
            Customer
          </label>

          <label>
            <input type="radio"
                   name="customerType"
                   value="service-provider"
                   [(ngModel)]="customer.customerType"
                   (change)="onCustomerTypeChange()"
                   required />
            Service Provider
          </label>
        </div>

        <!-- SERVICE TYPE -->
        <select *ngIf="customer.customerType === 'service-provider'"
                name="serviceType"
                [(ngModel)]="customer.serviceType"
                required>
          <option value="" disabled selected>Select Service Type</option>
          <option *ngFor="let service of serviceTypes" [value]="service">
            {{ service }}
          </option>
        </select>

        <button type="submit"
                class="primary-btn"
                [disabled]="!registerForm.valid ||
                (customer.customerType === 'service-provider' && !customer.serviceType)">
          Register
        </button>

        <div *ngIf="registrationSuccess" class="success-message">
          Registration successful! Redirecting to login...
        </div>

      </form>
    </div>
  </section>

</main>
